name: Build Android Widget APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Widget APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/StudyRoom-ПОНБ-УП-304С.apk
          echo "APK successfully built: $(ls -lh output/StudyRoom-ПОНБ-УП-304С.apk)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyRoom-ПОНБ-УП-304С-APK
          path: output/StudyRoom-ПОНБ-УП-304С.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: widget-apk-latest
          name: "Виджет расписания Android (ПОНБ-УП-304С)"
          body: |
            ### Нативный виджет расписания для Android
            * **Группа:** ПОНБ-УП-304С (Институт права УУНиТ)
            * **Дизайн:** Полное соответствие Tailwind-стилю веб-кабинета (тёмная тема, янтарные акценты, карточки пар).
            * **Функции:**
              * Автоматическое определение дня и текущей пары по времени Уфы (UTC+5).
              * Отображение номера пары, времени, названия предмета, преподавателя и аудитории.
              * Подсветка статуса «СЕЙЧАС».
              * Кнопка мгновенного обновления прямо с домашнего экрана.
              * Прямой переход в веб-кабинет по нажатию.
            
            **Скачать APK:** [StudyRoom-ПОНБ-УП-304С.apk](https://github.com/${{ github.repository }}/releases/download/widget-apk-latest/StudyRoom-%D0%9F%D0%9E%D0%9D%D0%91-%D0%A3%D0%9F-304%D0%A1.apk)
          files: output/StudyRoom-ПОНБ-УП-304С.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
